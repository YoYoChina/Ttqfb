<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#EDEDED">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>星极客</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="app.css">
</head>
<body>


<!-- ============ 本地启动屏（纯本地动画） ============ -->
<div id="splash">
  <div class="sp-logo">星</div>
  <div class="sp-name">星极客工作室</div>
  <div class="sp-txt">文学创作社区</div>
  <div class="sp-bar"><div class="sp-fill"></div></div>
</div>

<div id="app">

<!-- ============ 登录页 ============ -->
<section class="page" id="page-login">
  <div class="login-wrap">
    <div class="login-logo">星</div>
    <h1 class="login-title">星极客工作室</h1>
    <p class="login-sub">文学创作社区</p>
    <div class="login-card">
      <input id="lg-user" class="inp" placeholder="用户名" autocomplete="off">
      <input id="lg-pass" class="inp" type="password" placeholder="密码" autocomplete="off">
      <label class="keep-row"><input type="checkbox" id="lg-keep" checked><span>记住密码，下次自动登录</span></label>
      <button class="btn-main" id="lg-btn">登 录</button>
      <div class="login-links">
        <span id="lg-reg">注册账号</span>
        <span id="lg-srv">服务器设置</span>
      </div>
    </div>
    <p class="login-tip" id="lg-tip"></p>
  </div>
</section>

<!-- ============ 消息 ============ -->
<section class="page" id="page-chats">
  <header class="navbar"><span class="nav-title">消息</span><span class="nav-act" id="chats-new">＋</span></header>
  <div class="scroll" id="chats-list"></div>
</section>

<!-- ============ 聊天室 ============ -->
<section class="page" id="page-chat">
  <header class="navbar">
    <span class="nav-back" id="chat-back">‹</span>
    <span class="nav-title" id="chat-title">聊天</span>
    <span class="nav-act" id="chat-more">⋯</span>
  </header>
  <div class="scroll chat-body" id="chat-body"></div>
  <div class="chat-input-bar">
    <span class="ci-btn" id="ci-img">🖼</span>
    <input id="ci-text" class="ci-inp" placeholder="发消息…">
    <span class="ci-btn" id="ci-emoji">😊</span>
    <button class="ci-send" id="ci-send">发送</button>
  </div>
  <div class="emoji-panel" id="emoji-panel"></div>
  <input type="file" id="ci-file" accept="image/*" hidden>
</section>

<!-- ============ 发现 ============ -->
<section class="page" id="page-discover">
  <header class="navbar"><span class="nav-title">发现</span><span class="nav-act" id="dc-post">＋</span></header>
  <div class="scroll">
    <div class="dc-grid">
      <div class="dc-card" data-go="moments">
        <span class="dc-ico dc-ico-moment">✦</span>
        <span class="dc-name">动态</span>
        <span class="dc-desc">朋友圈 · 说说</span>
      </div>
      <div class="dc-card" data-go="articles">
        <span class="dc-ico dc-ico-book">📚</span>
        <span class="dc-name">文库</span>
        <span class="dc-desc">文章 · 作品</span>
      </div>
      <div class="dc-card" data-go="novels">
        <span class="dc-ico dc-ico-novel">📖</span>
        <span class="dc-name">小说连载</span>
        <span class="dc-desc">长篇 · 章节</span>
      </div>
      <div class="dc-card" data-go="forum">
        <span class="dc-ico dc-ico-forum">💬</span>
        <span class="dc-name">论坛</span>
        <span class="dc-desc">板块 · 帖子</span>
      </div>
    </div>
    <div class="sec-title">最新动态</div>
    <div id="dc-moments"></div>
  </div>
</section>

<!-- ============ 比赛 ============ -->
<section class="page" id="page-contest">
  <header class="navbar"><span class="nav-title">比赛</span><span class="nav-act" id="ct-refresh">↻</span></header>
  <div class="tabs" id="ct-tabs">
    <span class="tab on" data-st="all">全部</span>
    <span class="tab" data-st="prelim">初赛</span>
    <span class="tab" data-st="semi">预决赛</span>
    <span class="tab" data-st="final">决赛</span>
  </div>
  <div class="scroll" id="ct-list"></div>
</section>

<!-- ============ 我 ============ -->
<section class="page" id="page-me">
  <header class="navbar"><span class="nav-title">我</span><span class="nav-act" id="me-set">⚙</span></header>
  <div class="scroll" id="me-body"></div>
</section>

<!-- ============ 通用内页（列表/详情） ============ -->
<section class="page" id="page-sub">
  <header class="navbar">
    <span class="nav-back" id="sub-back">‹</span>
    <span class="nav-title" id="sub-title">详情</span>
    <span class="nav-act" id="sub-act"></span>
  </header>
  <div class="scroll" id="sub-body"></div>
</section>

<!-- ============ 底部 TabBar ============ -->
<nav class="tabbar" id="tabbar">
  <div class="tb on" data-tab="chats"><span class="tb-ico">💬</span><span class="tb-txt">消息</span></div>
  <div class="tb" data-tab="discover"><span class="tb-ico">✦</span><span class="tb-txt">发现</span></div>
  <div class="tb" data-tab="contest"><span class="tb-ico">🏆</span><span class="tb-txt">比赛</span></div>
  <div class="tb" data-tab="me"><span class="tb-ico">👤</span><span class="tb-txt">我</span></div>
</nav>

<!-- 遮罩 / 弹层 -->
<div class="mask" id="mask"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<div class="loading" id="loading"><div class="spinner"></div><span id="loading-txt">加载中</span></div>

</div>
<script src="api.js"></script>
<script src="app.js"></script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){})}</script>
</body>
</html>
