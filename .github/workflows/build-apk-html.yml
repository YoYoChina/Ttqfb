name: 打包 App(HTML 版 APK)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04 # 锁定稳定版系统，规避 Node 24 坑
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 整理目录
        run: |
          mkdir -p mobile_app
          for f in index.html app.css api.js app.js manifest.json sw.js; do
            [ -f "$f" ] && cp "$f" mobile_app/ && echo "归位 $f"
          done
          ls -la mobile_app/
          test -f mobile_app/index.html || (echo "错误：找不到 index.html" && exit 1)

      - name: 配置 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 配置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 统一 Android SDK 环境 (解决冲突 + 适配 Android 8+)
        run: |
          # GitHub 自带 SDK 在 /usr/local/lib/android/sdk，直接复用，不再手动下载
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          # 确保 SDK 34 和构建工具已安装（Capacitor 6 官方匹配）
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH" >> $GITHUB_ENV
          echo "SDK 路径已统一为: $ANDROID_HOME"

      - name: 准备 Capacitor 工程
        run: |
          npm init -y >/dev/null
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 --no-audit --no-fund
          npx cap init "星极客" com.xingjike.app --web-dir=mobile_app
          npx cap add android
          npx cap sync android

      - name: 锁定 Android 8+ 兼容 (minSdk=26) & SDK 34
        run: |
          f=android/variables.gradle
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 26/' "$f"
          sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 34/' "$f"
          sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 34/' "$f"
          grep -E "minSdkVersion|compileSdkVersion|targetSdkVersion" "$f"

      - name: 允许 HTTP 明文
        run: |
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p,encoding='utf-8').read()
          if 'usesCleartextTraffic' not in s:
              s=s.replace('<application', '<application\n        android:usesCleartextTraffic="true"',1)
              open(p,'w',encoding='utf-8').write(s)
              print('已开启明文 HTTP')
          PY

      - name: 构建 APK (清理冲突的 local.properties)
        run: |
          cd android
          # 防止旧路径残留导致 Gradle 再次冲突
          rm -f local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -q -Dorg.gradle.jvmargs="-Xmx2048m"
          ls -lh app/build/outputs/apk/debug/

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: xingjike-app-apk
          path: android/app/build/outputs/apk/debug/*.apk
