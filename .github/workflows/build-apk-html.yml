name: 打包 App（HTML 版 APK）

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04 # 锁定旧版系统，规避 Node 24 强制环境
    steps:
      - name: 检出代码
        uses: actions/checkout@v4 # v4 在 ubuntu-22.04 下稳定跑 Node 20

      - name: 整理目录（详细日志）
        run: |
          set -x # 打印每条命令，方便排错
          mkdir -p mobile_app
          for f in index.html app.css api.js app.js manifest.json sw.js; do
            if [ -f "$f" ]; then cp "$f" mobile_app/ && echo "归位 $f"; else echo "警告: 缺 $f"; fi
          done
          ls -la mobile_app/
          if [ ! -f "mobile_app/index.html" ]; then echo "致命: 无 index.html"; exit 1; fi

      - name: 配置 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 配置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 手动配置 Android SDK (锁定 34，适配 Capacitor 6)
        run: |
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline.zip
          unzip -q cmdline.zip -d $ANDROID_SDK_ROOT/cmdline-tools
          mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses
          # Capacitor 6 官方匹配 SDK 34
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH" >> $GITHUB_ENV

      - name: 准备 Capacitor 工程
        run: |
          npm init -y >/dev/null
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 --no-audit --no-fund
          npx cap init "星极客" com.xingjike.app --web-dir=mobile_app
          npx cap add android
          npx cap sync android

      - name: 允许 HTTP 明文
        run: |
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p,encoding='utf-8').read()
          if 'usesCleartextTraffic' not in s:
              s=s.replace('<application', '<application\n        android:usesCleartextTraffic="true"',1)
              open(p,'w',encoding='utf-8').write(s)
              print('已开启明文 HTTP')
          PY

      - name: 构建 APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -q -Dorg.gradle.jvmargs="-Xmx2048m"
          ls -lh app/build/outputs/apk/debug/

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: xingjike-app-apk
          path: android/app/build/outputs/apk/debug/*.apk
