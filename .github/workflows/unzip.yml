name: 解压前端包 · 发布 PWA（v3）

# v3：去掉旧的 Capacitor 打包任务（npm ci 容易卡、且不含权限声明），
# APK 统一交给 android.yml 手动 Run。
on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: starven-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-latest
    outputs:
      has_site: ${{ steps.unpack.outputs.has_site }}
    steps:
      - uses: actions/checkout@v4
      - name: 解压 zip 并合并到仓库根目录
        id: unpack
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=( *.zip )
          # 没有 zip 时：仓库已有 frontend 就照常重发，全空仓库则整体跳过（不会亮红叉）
          if [ ${#zips[@]} -eq 0 ]; then
            if [ -f frontend/index.html ]; then
              echo "没有新 zip，沿用现有 frontend/ 重新发布"
              echo "has_site=true" >> "$GITHUB_OUTPUT"
            else
              echo "没有待解压的 zip，跳过"
              echo "has_site=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          for z in "${zips[@]}"; do
            echo "解压 $z"
            unzip -oq "$z" -d .
            rm -f "$z"
          done
          for d in */; do
            if [ -d "$d/frontend" ] || [ -d "$d/.github" ]; then
              cp -a "$d." .
              rm -rf "$d"
            fi
          done
          test -f frontend/index.html || { echo "✗ 没找到 frontend/index.html"; exit 1; }
          find frontend -type f -exec chmod 644 {} +
          echo "has_site=true" >> "$GITHUB_OUTPUT"
          echo "✓ 解压完成，frontend/ 已就绪"
      - uses: actions/upload-artifact@v4
        if: steps.unpack.outputs.has_site == 'true'
        with:
          name: starven-site
          path: frontend/
          if-no-files-found: error
      - name: 提交（排除 .github，绕开 workflows 权限限制）
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -q -- .github/
          if git diff --staged --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "v3 前端：二维码/倒计时/积分/小球/权限更新"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi

  pages:
    needs: extract
    if: needs.extract.outputs.has_site == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: starven-site
          path: site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: 发布 Pages
        id: deployment
        uses: actions/deploy-pages@v4
