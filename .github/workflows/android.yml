name: 打包 Android APK（权限修复版 v3）

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # 不用 android-actions/setup-android：它在 cmdline-tools 16.0 上
      # 会去装早已下线的 "tools" 包，卡在许可协议并以退出码 1 失败。
      # ubuntu-latest runner 自带 Android SDK，直接找到 sdkmanager 用即可。
      - name: 准备 Android SDK
        run: |
          set -euo pipefail
          SDKROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SM="$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -1)" || true
          if [ -z "$SM" ]; then
            echo "✗ 没找到 sdkmanager，SDK 目录如下："
            ls -la "$SDKROOT" || true
            exit 1
          fi
          echo "sdkmanager: $SM"
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          if [ ! -d "$SDKROOT/platforms/android-34" ] || [ ! -d "$SDKROOT/build-tools/34.0.0" ]; then
            yes | "$SM" "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true
          fi
          test -d "$SDKROOT/platforms/android-34" || { echo "✗ android-34 未就绪"; exit 1; }
          echo "ANDROID_HOME=$SDKROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDKROOT" >> "$GITHUB_ENV"
          echo "$SDKROOT/platform-tools" >> "$GITHUB_PATH"
          echo "✓ SDK 就绪"
      - name: 安装 Gradle 8.4
        run: |
          curl -fL --retry 2 -o "$RUNNER_TEMP/g.zip" \
            https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -q "$RUNNER_TEMP/g.zip" -d "$RUNNER_TEMP/g"
          echo "$RUNNER_TEMP/g/gradle-8.4/bin" >> "$GITHUB_PATH"
      - name: 生成工程（权限声明 + 首次申请 + WebView 放行）
        run: bash make-android.sh
      - name: 编译 APK
        run: cd android && gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: starven-hide-and-seek-v3
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
